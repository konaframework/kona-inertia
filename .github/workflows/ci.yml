name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require locked governance files
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f MILESTONES.md
          test -f README.md
          test -f LICENSE
          test -f docs/governance/HANDOFF.md
          test -f .cursor/rules/inertia-milestones.mdc

  jvm:
    name: Kotlin + Java (100% Kover) and samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Kona core ref
        id: kona
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ -n "${HEAD_REF}" ] && git ls-remote --exit-code --heads "https://github.com/konaframework/kona.git" "${HEAD_REF}" >/dev/null 2>&1; then
            echo "ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: konaframework/kona
          ref: ${{ steps.kona.outputs.ref }}
          path: .kona
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish Kona artifacts to Maven local
        working-directory: .kona
        run: ./gradlew publishToMavenLocal -x test --no-configuration-cache
      - name: Inertia tests with 100% line + branch coverage
        run: ./gradlew :kona-inertia:test :kona-inertia:koverVerify --rerun-tasks --no-build-cache
      - name: Kotlin + Java samples
        run: ./gradlew :inertia-sample-kotlin:test :inertia-sample-java:test
